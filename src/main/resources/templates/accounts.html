<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('邮箱账号')}"></head><body><aside th:replace="~{layout :: nav('accounts')}"></aside><main id="main-content" tabindex="-1" class="main"><header><div><p class="eyebrow">CONNECTIONS</p><h1>邮箱账号</h1><p class="muted">每个账号使用独立的 IMAP 与 SMTP 连接。</p></div><a class="button primary" th:href="@{/accounts/new}">＋ 添加邮箱</a></header><div th:replace="~{layout :: alerts}"></div><section class="panel empty" th:if="${#lists.isEmpty(allAccounts)}"><h2>连接你的第一个邮箱</h2><p>准备好服务器地址和邮箱授权码，即可开始配置。</p><a class="button" th:href="@{/accounts/new}">添加邮箱 →</a></section><form id="batch-sync" class="panel" th:unless="${#lists.isEmpty(allAccounts)}" th:action="@{/accounts/sync}" method="post"><div class="actions"><button class="primary" name="all" value="false">同步选中邮箱</button><button name="all" value="true">同步全部已启用邮箱</button></div><p class="fine">在下方勾选账号。按原同步范围收取，每次最多 100 封；暂停或需重置的账号不会同步。提交后刷新查看结果。</p></form><section class="panel" th:each="account : ${allAccounts}"><label class="checkbox" th:if="${account.enabled and !account.resetRequired}"><input type="checkbox" form="batch-sync" name="accountIds" th:value="${account.id}">选择此邮箱</label><div class="section-title"><div><h2 th:text="${account.name}"></h2><span class="muted" th:text="${account.email}"></span></div><span class="badge" th:classappend="${account.enabled ? 'SENT' : 'PENDING'}" th:text="${account.enabled ? '运行中' : '已暂停'}"></span></div><div class="connection-grid"><div><span class="fine">收取服务器</span><p class="mono" th:text="${account.imapHost + ':' + account.imapPort + ' / ' + account.imapTls}"></p></div><div><span class="fine">发送服务器</span><p class="mono" th:text="${account.smtpHost + ':' + account.smtpPort + ' / ' + account.smtpTls}"></p></div><div><span class="fine">最近检查</span><p th:text="${account.lastChecked == null ? '尚未检查' : #temporals.format(account.lastChecked, 'yyyy-MM-dd HH:mm:ss')}"></p></div></div><p class="alert" th:if="${account.lastError}" th:text="${account.lastError}"></p><div class="actions"><a class="button" th:href="@{/accounts/{id}/edit(id=${account.id})}">编辑配置</a><form th:action="@{/accounts/{id}/test(id=${account.id})}" method="post"><button>测试连接</button></form><form th:unless="${account.resetRequired}" th:action="@{/accounts/{id}/toggle(id=${account.id})}" method="post"><button th:text="${account.enabled ? '暂停账号' : '启用账号'}"></button></form></div><form class="reset-box" th:if="${account.resetRequired}" th:action="@{/accounts/{id}/reset(id=${account.id})}" method="post"><p>服务器邮件标识已变化。重新同步可能再次处理旧邮件；选择 0 仅处理启用后的新邮件。</p><label>回溯天数<input type="number" name="historyDays" min="0" max="3650" value="0" required></label><button>确认重置同步范围</button></form></section></main></body></html>
