<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('邮箱配置')}"></head><body><aside th:replace="~{layout :: nav('accounts')}"></aside><main class="main narrow"><header><div><p class="eyebrow">CONNECTION SETTINGS</p><h1 th:text="${id == null ? '添加邮箱' : '编辑邮箱'}"></h1><p class="muted">QQ、163 等邮箱通常需要授权码，具体以邮箱服务商要求为准。</p></div></header><form th:action="@{/accounts/save}" method="post" th:object="${form}"><input th:if="${id != null}" type="hidden" name="id" th:value="${id}"><section class="panel"><h2>基本信息</h2><div class="form-grid"><label>账号名称<input th:field="*{name}" required maxlength="100" placeholder="例如：工作邮箱"></label><label>邮箱地址<input th:field="*{email}" type="email" required maxlength="254" placeholder="you@example.com"></label></div></section><section class="panel"><h2>IMAP · 接收邮件</h2><div class="form-grid"><label>服务器地址<input th:field="*{imapHost}" required placeholder="imap.example.com"></label><label>端口<input th:field="*{imapPort}" type="number" min="1" max="65535" required></label><label>传输加密<select th:field="*{imapTls}"><option value="SSL">SSL / TLS</option><option value="STARTTLS">STARTTLS（必须支持）</option></select></label><label>登录用户名<input th:field="*{imapUsername}" required autocomplete="off"></label><label class="span-2">密码 / 授权码<input name="imapPassword" type="password" autocomplete="new-password" th:required="${id == null}" maxlength="512" th:placeholder="${id == null ? '填写邮箱密码或授权码' : '留空保留已有凭据'}"></label></div></section><section class="panel"><h2>SMTP · 发送邮件</h2><div class="form-grid"><label>服务器地址<input th:field="*{smtpHost}" required placeholder="smtp.example.com"></label><label>端口<input th:field="*{smtpPort}" type="number" min="1" max="65535" required></label><label>传输加密<select th:field="*{smtpTls}"><option value="SSL">SSL / TLS</option><option value="STARTTLS">STARTTLS（必须支持）</option></select></label><label>登录用户名<input th:field="*{smtpUsername}" required autocomplete="off"></label><label class="span-2">密码 / 授权码<input name="smtpPassword" type="password" autocomplete="new-password" th:required="${id == null}" maxlength="512" th:placeholder="${id == null ? '可与 IMAP 使用同一授权码' : '留空保留已有凭据'}"></label></div></section><section class="panel"><h2>同步设置</h2><label>首次启用时回溯天数<input th:field="*{historyDays}" type="number" min="0" max="3650" required></label><p class="fine">0 表示仅处理新邮件；已开始同步后，修改此值不会重新扫描历史邮件。暂停后恢复会继续原进度。</p><label class="checkbox"><input th:field="*{enabled}" type="checkbox">启用账号</label><p class="fine">建议先保存邮箱并配置规则，再启用账号。未命中规则的邮件不会因后续新增规则而重新处理。</p></section><div class="actions"><button class="primary">保存配置</button><a class="button quiet" th:href="@{/accounts}">取消</a></div></form></main></body></html>
