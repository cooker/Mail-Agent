<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('转发规则')}"></head><body><aside th:replace="~{layout :: nav('rules')}"></aside><main class="main"><header><div><p class="eyebrow">ROUTING RULES</p><h1>转发规则</h1><p class="muted">匹配全部规则，汇总目标邮箱，同一目标只转发一次。</p></div><a class="button primary" th:href="@{/rules/new}">＋ 新建规则</a></header><div th:replace="~{layout :: alerts}"></div><section class="panel empty" th:if="${#lists.isEmpty(rules)}"><h2>定义邮件的下一站</h2><p>按主题和收件地址，决定邮件应转发给谁。</p><a class="button" th:href="@{/rules/new}">新建规则 →</a></section><section class="panel" th:each="rule : ${rules}"><div class="section-title"><h2><span class="fine" th:text="${'#' + rule.id + ' / '}"></span><span th:text="${rule.name}"></span></h2><span class="badge" th:classappend="${rule.enabled ? 'SENT' : 'PENDING'}" th:text="${rule.enabled ? '已启用' : '已停用'}"></span></div><p th:if="${rule.matchAll}" class="alert">转发全部邮件：此规则未设置筛选条件。</p><dl><dt>来源账号</dt><dd th:if="${#sets.isEmpty(rule.accountIds)}">所有账号</dd><dd th:unless="${#sets.isEmpty(rule.accountIds)}"><span th:each="a : ${allAccounts}" th:if="${rule.accountIds.contains(a.id)}" class="tag" th:text="${a.name}"></span></dd><dt>主题条件</dt><dd th:text="${#strings.isEmpty(rule.subjectPattern) ? '不限' : rule.subjectMode.label + ' · ' + rule.subjectPattern}"></dd><dt>To / Cc 地址</dt><dd th:text="${#sets.isEmpty(rule.recipients) ? '不限' : #strings.setJoin(rule.recipients, ', ')}"></dd><dt>转发至</dt><dd class="target" th:text="${#strings.setJoin(rule.targets, ', ')}"></dd></dl><div class="actions"><a class="button" th:href="@{/rules/{id}/edit(id=${rule.id})}">编辑规则</a><form th:action="@{/rules/{id}/toggle(id=${rule.id})}" method="post"><button th:text="${rule.enabled ? '停用' : '启用'}"></button></form></div></section></main></body></html>
