<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('规则配置')}"></head><body><aside th:replace="~{layout :: nav('rules')}"></aside><main id="main-content" tabindex="-1" class="main narrow"><header><div><p class="eyebrow">RULE SETTINGS</p><h1 th:text="${id == null ? '新建规则' : '编辑规则'}"></h1><p class="muted">不同条件同时满足才触发；同一条件中的多个地址，命中任一即可。</p></div></header><form th:action="@{/rules/save}" method="post" th:object="${form}"><input th:if="${id != null}" type="hidden" name="id" th:value="${id}"><section class="panel"><label>规则名称<input th:field="*{name}" required maxlength="100" placeholder="例如：账单转发至财务"></label><label class="checkbox"><input type="checkbox" th:field="*{enabled}">启用此规则</label></section><section class="panel"><h2>当邮件满足</h2><fieldset><legend>接入账号 · 不选表示全部</legend><label class="checkbox" th:each="a : ${allAccounts}"><input type="checkbox" th:field="*{accountIds}" th:value="${a.id}"><span th:text="${a.name + ' · ' + a.email}"></span></label><p class="fine" th:if="${#lists.isEmpty(allAccounts)}">尚未添加邮箱。此规则默认适用于后续接入的全部邮箱。</p></fieldset><div class="form-grid"><label>主题匹配方式<select th:field="*{subjectMode}"><option value="CONTAINS">包含</option><option value="EXACT">完全匹配</option><option value="REGEX">正则表达式</option></select></label><label>主题条件<input th:field="*{subjectPattern}" maxlength="1000" placeholder="留空表示不限"></label></div><label class="checkbox"><input type="checkbox" th:field="*{ignoreCase}">忽略主题大小写</label><p class="fine">正则匹配任意子串；完整匹配请使用 ^ 和 $。采用 RE2 语法，不支持回溯引用或前后查找。</p><label>邮件 To / Cc 地址<textarea th:field="*{recipients}" rows="3" placeholder="finance@example.com, invoices@example.com"></textarea></label><p class="fine">完整地址匹配，以逗号或换行分隔。留空不限；Bcc 地址通常不可见，不参与匹配。</p></section><section class="panel"><h2>转发到</h2><label>目标邮箱<textarea th:field="*{targets}" rows="3" required placeholder="archive@example.com"></textarea></label><p class="fine">可填写多个目标，每个目标单独发送。系统会去重并排除来源邮箱。</p></section><div class="actions"><button class="primary">保存规则</button><a class="button quiet" th:href="@{/rules}">取消</a></div></form></main></body></html>
