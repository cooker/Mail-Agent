<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('匹配测试')}"></head><body><aside th:replace="~{layout :: nav('test')}"></aside><main class="main narrow"><header><div><p class="eyebrow">RULE PLAYGROUND</p><h1>先测试，再转发。</h1><p class="muted">输入模拟邮件，查看已启用规则的匹配结果。不会发送邮件。</p></div></header><section class="panel"><form th:action="@{/rules/test}" method="post"><label>接入账号<select name="accountId" required><option th:each="a : ${allAccounts}" th:value="${a.id}" th:text="${a.name + ' · ' + a.email}" th:selected="${accountId == a.id}"></option></select></label><label>邮件主题<input name="subject" th:value="${subject}" placeholder="例如：九月费用账单"></label><label>To / Cc 地址<textarea name="recipients" rows="3" th:text="${recipients}" placeholder="逗号或换行分隔"></textarea></label><button class="primary" th:disabled="${#lists.isEmpty(allAccounts)}">运行匹配测试 →</button><p class="fine" th:if="${#lists.isEmpty(allAccounts)}">请先添加一个邮箱账号。</p></form></section><section class="panel" th:if="${result != null}"><h2>匹配结果</h2><dl><dt>命中规则编号</dt><dd th:text="${result.ruleIds().isEmpty() ? '无' : result.ruleIds()}"></dd><dt>转发目标</dt><dd th:text="${result.targets().isEmpty() ? '无转发目标' : #strings.setJoin(result.targets(), ', ')}"></dd></dl><p class="fine">已去除重复地址和来源邮箱地址。</p></section></main></body></html>
