<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('运行概览')}"></head><body><aside th:replace="~{layout :: nav('dashboard')}"></aside><main class="main"><header><div><p class="eyebrow">WORKSPACE / OVERVIEW</p><h1>邮件，各就其位。</h1><p class="muted">连接多个邮箱，让规则处理每一次转发。</p></div><a class="button primary" th:href="@{/accounts/new}">＋ 添加邮箱</a></header><div th:replace="~{layout :: alerts}"></div><section class="stats"><article><span>接入邮箱</span><strong th:text="${accountCount}">0</strong></article><article><span>转发规则</span><strong th:text="${ruleCount}">0</strong></article><article><span>已处理邮件</span><strong th:text="${mailCount}">0</strong></article><article><span>成功转发</span><strong th:text="${sentCount}">0</strong></article></section><div th:if="${unknownCount > 0 or failedCount > 0}" class="alert">需要关注：<strong th:text="${failedCount}"></strong> 个失败任务，<strong th:text="${unknownCount}"></strong> 个结果未知任务。<a th:href="@{/records}">查看处理记录 →</a></div><section class="panel" th:if="${accountCount == 0}"><p class="eyebrow">GET STARTED</p><h2>三步开启自动转发</h2><div class="steps"><div><b>01 / 连接邮箱</b><p>填写 IMAP 与 SMTP 参数，并验证连接。</p></div><div><b>02 / 设置规则</b><p>选择主题、收件地址和目标邮箱。</p></div><div><b>03 / 启用同步</b><p>回到邮箱列表启用账号，自动检查新邮件。</p></div></div></section><section class="panel"><div class="section-title"><h2>最近处理</h2><a th:href="@{/records}">全部记录 ↗</a></div><p th:if="${#lists.isEmpty(recent)}" class="empty">尚无邮件记录。启用邮箱后，处理结果将显示在这里。</p><div class="table-wrap" th:unless="${#lists.isEmpty(recent)}"><table><thead><tr><th>邮件主题</th><th>处理结果</th><th>处理时间</th></tr></thead><tbody><tr th:each="mail : ${recent}"><td><a th:href="@{/records/{id}(id=${mail.id})}" th:text="${#strings.isEmpty(mail.subject) ? '（无主题）' : mail.subject}"></a><small th:text="${mail.sender}"></small></td><td th:text="${mail.outcome}"></td><td class="mono" th:text="${#temporals.format(mail.processedAt, 'yyyy-MM-dd HH:mm:ss')}"></td></tr></tbody></table></div></section></main></body></html>
