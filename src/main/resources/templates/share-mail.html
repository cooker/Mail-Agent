<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head(${mail.subject})}"></head><body class="public-body"><main id="main-content" tabindex="-1" class="public-main"><header><div><p class="eyebrow">SHARED MESSAGE</p><h1 class="mail-title" th:text="${#strings.isEmpty(mail.subject) ? '（无主题）' : mail.subject}"></h1></div><a class="button" th:href="@{/s/{token}(token=${token})}">返回邮件列表</a></header><section class="panel"><dl><dt>发件人</dt><dd th:text="${mail.sender}"></dd><dt>To / Cc</dt><dd th:text="${mail.recipients}"></dd><dt>接收时间</dt><dd th:text="${#temporals.format(mail.receivedAt, 'yyyy-MM-dd HH:mm:ss')}"></dd></dl></section><section class="panel"><h2>邮件正文</h2><p class="alert" th:unless="${content.available}">邮件内容当前不可用。</p><div class="mail-html" th:if="${content.available and !#strings.isEmpty(content.html)}" th:utext="${content.html}"></div><pre class="mail-body" th:if="${content.available and #strings.isEmpty(content.html)}" th:text="${#strings.isEmpty(content.text) ? '（无文本正文）' : content.text}"></pre><div th:if="${content.available and !#lists.isEmpty(content.attachments)}"><h2>附件</h2><div class="attachment" th:each="item : ${content.attachments}"><div><strong th:text="${item.name}"></strong><small th:text="${item.contentType + (item.size >= 0 ? ' · ' + item.size + ' bytes' : '')}"></small></div><a class="button" th:href="@{/s/{token}/mail/{mailId}/attachments/{index}(token=${token},mailId=${mail.id},index=${item.index})}">下载</a></div></div><p class="fine">HTML 邮件会保留安全的排版格式；远程图片、脚本和危险属性不会加载或执行。</p></section></main></body></html>
