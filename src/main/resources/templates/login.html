<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('管理员登录')}"></head><body class="login-body"><section class="login-intro"><span class="intro-number">MAIL AGENT / WORKSPACE</span><h2>让每封邮件，<br>抵达正确的位置。</h2><p>连接你的邮箱，以规则组织信息。<br>从自动转发到内容分享，在一处完成。</p><div class="steps"><div><b>连接</b><p>多个邮箱</p></div><div><b>流转</b><p>自动规则</p></div><div><b>分享</b><p>按需开放</p></div></div></section><main id="main-content" tabindex="-1" class="login-card"><div class="brand"><span class="mark">M</span> Mail Agent</div><p class="eyebrow">让每封邮件，抵达正确的位置</p><h1>登录邮箱工作台</h1><p class="muted">管理邮箱连接、自动转发和处理记录。</p><div th:if="${param.error}" class="alert" role="alert">用户名或密码错误</div><div th:if="${param.logout}" class="notice">已安全退出登录</div><form th:action="@{/login}" method="post"><label>管理员账号<input name="username" autocomplete="username" required autofocus></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button class="primary full" type="submit">登录 →</button></form><p class="fine">使用部署时配置的管理员凭据。</p></main></body></html>
