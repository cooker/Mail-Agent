<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${title} + ' · Mail Agent'">Mail Agent</title><link rel="stylesheet" th:href="@{/app.css}"><link rel="stylesheet" th:href="@{/mail-content.css}"></head>
<body>
<aside th:fragment="nav(active)" class="sidebar"><a class="brand" th:href="@{/}"><span class="mark">M</span> Mail Agent</a><div class="nav-label">邮箱工作台</div><nav><a th:href="@{/}" th:classappend="${active == 'dashboard'} ? 'active'">运行概览</a><a th:href="@{/accounts}" th:classappend="${active == 'accounts'} ? 'active'">邮箱账号</a><a th:href="@{/rules}" th:classappend="${active == 'rules'} ? 'active'">转发规则</a><a th:href="@{/rules/test}" th:classappend="${active == 'test'} ? 'active'">匹配测试</a><a th:href="@{/records}" th:classappend="${active == 'records'} ? 'active'">邮箱内容</a><a th:href="@{/shares}" th:classappend="${active == 'shares'} ? 'active'">分享页面</a></nav><div class="sidebar-bottom"><span class="muted">每 60 秒检查新邮件</span><form th:action="@{/logout}" method="post"><button class="quiet" type="submit">退出登录 ↗</button></form></div></aside>
<div th:fragment="alerts"><div th:if="${notice}" class="notice" role="status" th:text="${notice}"></div><div th:if="${error}" class="alert" role="alert" th:text="${error}"></div></div>
<span th:fragment="status(value)" class="badge" th:classappend="${value.name()}" th:switch="${value.name()}"><span th:case="'PENDING'">待发送</span><span th:case="'SENDING'">发送中</span><span th:case="'RETRY'">等待重试</span><span th:case="'SENT'">已发送</span><span th:case="'FAILED'">失败</span><span th:case="'UNKNOWN'">结果未知</span></span>
</body></html>
