server:
  address: ${BIND_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
spring:
  application:
    name: mail-agent
  datasource:
    url: jdbc:h2:file:${DATA_DIR:./data}/mail-agent;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  thymeleaf:
    cache: true
  web:
    error:
      include-message: never
      include-stacktrace: never
app:
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:admin}
  data-dir: ${DATA_DIR:./data}
  poll-delay-ms: ${POLL_DELAY_MS:60000}
  send-delay-ms: 5000
  scheduling-enabled: true
logging:
  level:
    org.eclipse.angus.mail: WARN
    org.hibernate.orm.jdbc.bind: OFF
